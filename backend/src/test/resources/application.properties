# ===================================================================
# Test Environment Configuration (Isolated In-Memory H2 Database)
# ===================================================================
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:pharmatrack_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create and drop schema for isolated testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.flyway.enabled=false

# Ephemeral test-only JWT & security configuration (no static secrets committed)
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.jwt.expiration-ms=3600000
app.security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.security.bootstrap.enabled=false
app.security.local-demo.enabled=false

# AI Copilot test-profile isolation (always disabled by default in test suite)
app.ai.enabled=false
app.ai.api-key=
app.ai.batch-analysis.permanent-delete.enabled=true
