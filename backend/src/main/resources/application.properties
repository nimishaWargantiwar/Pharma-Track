# ===================================================================
# PharmaTrack Backend Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Details & Active Profile
spring.application.name=pharmatrack-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# MySQL Database Configuration
# Dedicated Application User: pharmatrack_app
# Passwords and secrets are environment-driven or read from gitignored local config
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pharmatrack_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:pharmatrack_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate & Flyway Configuration (Local Schema Protection)
# ===================================================================
# Local startup validates the existing 13-table schema instead of mutating DDL,
# and keeps Flyway disabled by default (prod explicitly enables Flyway in application-prod.properties).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# SQL Logging (useful for development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# HikariCP Connection Pool - Fail-Fast Configuration
# Fail-fast connection settings ensure application fails clearly if DB is unavailable
# ===================================================================
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# Authentication, JWT & Security Configuration
# Secrets and passwords MUST come from environment variables or
# gitignored local config files — never hardcoded in tracked source.
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.security.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap.admin-full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.security.local-demo.enabled=${LOCAL_DEMO_USERS_ENABLED:false}
app.security.local-demo.password=${PHARMATRACK_DEMO_PASSWORD:}

# ===================================================================
# Error Handling Hygiene
# ===================================================================
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
