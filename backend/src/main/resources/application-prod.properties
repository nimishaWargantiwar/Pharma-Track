# ===================================================================
# PharmaTrack Production Profile Configuration
# ===================================================================
# Activated via SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# All database connection settings, credentials, CORS origins, and JWT secrets MUST be
# supplied via environment variables. Missing required variables fail startup cleanly
# instead of falling back to localhost, local demo credentials, or the local profile.
# ===================================================================

# Render-compatible HTTP server port (Render injects PORT dynamically)
server.port=${PORT:8080}

# MySQL 8.0+ Managed Database Connection (TLS required; no localhost/local DB fallbacks)
# Supply DB_URL, or supply DB_HOST + DB_NAME (+ optional DB_PORT and DB_SSL_MODE).
spring.datasource.url=${prod.resolved.datasource.url:${DB_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (Managed MySQL Production Tuning)
spring.datasource.hikari.pool-name=PharmaTrackProdPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.initialization-fail-timeout=5000

# JPA / Hibernate Configuration (Strict validation only; no SQL/parameter logging)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.jpa.open-in-view=false

# Flyway Schema Migrations (Enabled; baseline-on-migrate disabled by default)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Production Logging Hygiene (Disable SQL statement & bind parameter logging)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# JWT Authentication (Minimum 256-bit secret required; startup fails closed if missing/weak)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Security, CORS & Admin Bootstrap (Explicit origins required; local demo users disabled)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.security.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap.admin-full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.security.local-demo.enabled=false
app.security.local-demo.password=

# Error Handling Hygiene
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# AI Copilot Configuration (Disabled by default; API key provided via environment)
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.provider=${APP_AI_PROVIDER:openai}
app.ai.base-url=${APP_AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${APP_AI_MODEL:gpt-6-luna}
app.ai.connect-timeout-ms=${APP_AI_CONNECT_TIMEOUT_MS:3000}
# Note: Read timeout is a socket-read inactivity timeout (SO_TIMEOUT), not a guaranteed total request deadline.
app.ai.read-timeout-ms=${APP_AI_READ_TIMEOUT_MS:60000}
app.ai.max-output-tokens=${APP_AI_MAX_OUTPUT_TOKENS:800}
app.ai.batch-analysis.max-output-tokens=${APP_AI_BATCH_ANALYSIS_MAX_OUTPUT_TOKENS:4096}

